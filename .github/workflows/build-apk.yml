name: APK bauen

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5

      - name: Android SDK prüfen/ergänzen
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          ls "$SDK" || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          fi
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      # shell: bash setzt pipefail – sonst verschluckt "tee" einen Gradle-Fehler
      - name: Release-APK bauen
        shell: bash
        run: bash ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Test-APK bauen (installiert parallel zur normalen App)
        shell: bash
        run: bash ./gradlew assembleTryout --no-daemon --stacktrace 2>&1 | tee -a /tmp/build.log

      - name: APK umbenennen
        if: always()
        run: |
          [ -f app/build/outputs/apk/release/app-release.apk ] && cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/N3-Gallery-1.30-release.apk || true
          [ -f app/build/outputs/apk/tryout/app-tryout.apk ] && cp app/build/outputs/apk/tryout/app-tryout.apk app/build/outputs/apk/tryout/N3-Gallery-1.30-TEST.apk || true

      - name: APK hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N3-Gallery-APK
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      # Prüfen, dass wirklich installierbare APKs entstanden sind – und dass alle mit
      # demselben festen Schlüssel signiert wurden. Nur dann lässt sich die App später
      # über die bereits installierte Version aktualisieren.
      - name: APK prüfen
        if: always()
        run: |
          ls -la app/build/outputs/apk/release/ app/build/outputs/apk/tryout/ 2>/dev/null || true
          AAPT="$SDK/build-tools/36.0.0/aapt2"
          SIGNER="$SDK/build-tools/36.0.0/apksigner"
          EXPECTED="2FB36AC65D73A4B1E437C84784E0EB50442F123ADB923BFD450DA8EB24C848E0"
          FAIL_SIG=0
          for apk in app/build/outputs/apk/release/*.apk app/build/outputs/apk/tryout/*.apk; do
            [ -f "$apk" ] || continue
            echo "== $apk =="
            sha256sum "$apk"
            [ -x "$AAPT" ] && "$AAPT" dump badging "$apk" | head -6 || true
            if [ -x "$SIGNER" ]; then
              FP=$("$SIGNER" verify --print-certs "$apk" 2>/dev/null | awk -F': ' '/SHA-256 digest/{print $2; exit}')
              NORM=$(echo "$FP" | tr -d ':' | tr '[:lower:]' '[:upper:]')
              if [ "$NORM" = "$EXPECTED" ]; then
                echo "Signatur SHA-256: $NORM  (fest, Updates moeglich)"
              else
                echo "SIGNATUR-FEHLER: $NORM  erwartet: $EXPECTED"
                FAIL_SIG=1
              fi
            fi
          done
          if [ "$FAIL_SIG" = "1" ]; then
            echo ""
            echo "Die APKs sind NICHT mit dem festen Schluessel signiert - so laesst sich die"
            echo "App nicht ueber eine vorhandene Installation aktualisieren."
            exit 1
          fi

      # Fertige APKs als Release bereitstellen – dann lässt sich die neue Version
      # direkt auf dem Handy herunterladen und antippen.
      - name: APKs als Release bereitstellen
        if: github.ref_name != 'main' && github.ref_name != 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="testbuild-1.30"
          git archive --format=zip -o /tmp/N3Gallery-Projekt-1.30.zip HEAD app build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat gradle tools .github ci keystore.properties SIGNIEREN.md README.md AENDERUNGEN.md || true
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Testbuild 1.30 – Ordner-Zähler korrekt, flüssiges Scrollen" \
              --notes "Automatisch gebaut. Zwei APKs: \"N3-Gallery-1.30-release.apk\" (gleiche App wie bisher, neue Version) und \"N3-Gallery-1.30-TEST.apk\" (installiert parallel zur vorhandenen App, nichts geht verloren). Quelle: Branch ${{ github.ref_name }}." \
              --prerelease
          fi
          gh release upload "$TAG" app/build/outputs/apk/release/N3-Gallery-1.30-release.apk app/build/outputs/apk/tryout/N3-Gallery-1.30-TEST.apk /tmp/N3Gallery-Projekt-1.30.zip --clobber

      # Damit Build-Fehler auch ohne Zugriff auf die Runner-Logs gelesen werden können:
      # die wichtigsten Zeilen landen als Kommentar am Pull Request.
      - name: Build-Protokoll in den Pull Request schreiben
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Build-Protokoll (${{ job.status }})"
            echo '```'
            grep -nE "^(e: |FAILURE|\* What went wrong|Caused by|Execution failed)|error:|Could not|Unresolved" /tmp/build.log | tail -40 || true
            echo '--- APK-Daten ---'
            AAPT="$SDK/build-tools/36.0.0/aapt2"
            SIGNER="$SDK/build-tools/36.0.0/apksigner"
            for apk in app/build/outputs/apk/release/N3-Gallery-1.30-release.apk app/build/outputs/apk/tryout/N3-Gallery-1.30-TEST.apk; do
              [ -f "$apk" ] || continue
              echo "$apk"
              [ -x "$AAPT" ] && "$AAPT" dump badging "$apk" | grep -E "^package:|^application-label:|^launchable-activity:|^sdkVersion:|^targetSdkVersion:" || true
              # Signatur-Fingerabdruck – muss bleiben, damit Updates installierbar sind
              [ -x "$SIGNER" ] && "$SIGNER" verify --print-certs "$apk" 2>/dev/null | grep -i "SHA-256 digest" | head -1 || true
            done
            echo '--- letzte Zeilen ---'
            tail -12 /tmp/build.log || true
            echo '```'
          } > /tmp/report.md
          PR=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number' || true)
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body-file /tmp/report.md --edit-last || gh pr comment "$PR" --body-file /tmp/report.md || true
          fi
