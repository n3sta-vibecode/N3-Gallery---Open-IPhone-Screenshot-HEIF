name: Modell-Umgebung messen

# Diagnose-Werkzeug: prüft, welche Klassen im ausgelieferten MediaPipe-Paket wirklich
# vorhanden sind und welche Größe die Modelldateien auf dem Server haben.
#
# Warum: Die App baut die Engine per Reflection. Wenn eine Klasse fehlt, die MediaPipe
# intern braucht (z. B. com.google.ai.edge.litertlm.ActivationDataType), scheitert der
# Start mit einer Meldung, die auf dem Gerät nur als Klassenname ankommt. Dieses Werkzeug
# schaut direkt in das AAR, das Gradle für die App auflöst – und schreibt die Fakten als
# Commit-Kommentar heraus, damit man sie ohne Runner-Logs lesen kann.

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/diag-modell.yml'

jobs:
  messen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5

      - name: Abhängigkeiten auflösen
        shell: bash
        run: |
          # Nur auflösen, nicht bauen – das AAR landet dabei im Gradle-Cache.
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon \
            > /tmp/deps.txt 2>&1 || true
          grep -iE "mediapipe|litert" /tmp/deps.txt | sort -u > /tmp/deps-mediapipe.txt || true

      - name: AARs direkt laden und untersuchen
        shell: bash
        continue-on-error: true
        run: |
          set -u
          exec 2>&1
          OUT=/tmp/bericht.md
          echo "## LiteRT-LM im Paket" > "$OUT"
          D="https://dl.google.com/dl/android/maven2"
          rm -rf /tmp/x && mkdir -p /tmp/x && cd /tmp/x

          # Kombiniertes AAR von tasks-retrieval (enthält MediaPipe UniversalEmbedder)
          if curl -sSL -m 180 -o mp.aar \
              "$D/com/google/mediapipe/tasks-retrieval/1.2.3/tasks-retrieval-1.2.3.aar"; then
            mkdir -p mp && (cd mp && unzip -oq ../mp.aar) || echo "mp entpacken fehlgeschlagen" >> "$OUT"
            echo "tasks-retrieval geladen: $(stat -c%s mp.aar) Bytes" >> "$OUT"
          else
            echo "tasks-retrieval-laden fehlgeschlagen" >> "$OUT"
          fi

          # LiteRT-LM selbst (separates Artefakt)
          if curl -sSL -m 180 -o lm.aar \
            "$D/com/google/ai/edge/litertlm/litertlm-android/0.17.0-alpha1/litertlm-android-0.17.0-alpha1.aar"; then
            mkdir -p lm && (cd lm && unzip -oq ../lm.aar) || echo "lm entpacken fehlgeschlagen" >> "$OUT"
            echo "litertlm geladen: $(stat -c%s lm.aar) Bytes" >> "$OUT"
          else
            echo "litertlm-laden fehlgeschlagen" >> "$OUT"
          fi

          ls -la /tmp/x >> "$OUT" 2>&1
          echo "" >> "$OUT"

          echo "### LiteRT-LM-Klassen im MediaPipe-AAR" >> "$OUT"
          echo '```' >> "$OUT"
          (cd /tmp/x/mp 2>/dev/null && unzip -l classes.jar 2>/dev/null | grep -E "litertlm" | awk '{print $4}') >> "$OUT" 2>&1 || echo "-" >> "$OUT"
          echo '```' >> "$OUT"
          echo "" >> "$OUT"

          echo "### Klassen im LiteRT-LM-AAR (Auswahl)" >> "$OUT"
          echo '```' >> "$OUT"
          (cd /tmp/x/lm 2>/dev/null && unzip -l classes.jar 2>/dev/null | grep -E "ActivationDataType|EmbeddingEngine|Backend|UniversalEmbedder" | awk '{print $4}') >> "$OUT" 2>&1 || echo "-" >> "$OUT"
          echo '```' >> "$OUT"
          echo "" >> "$OUT"

          echo "### Signaturen (javap)" >> "$OUT"
          echo '```' >> "$OUT"
          for J in /tmp/x/lm/classes.jar /tmp/x/mp/classes.jar; do
            [ -f "$J" ] || continue
            echo "== $J" >> "$OUT"
            for C in \
              com.google.ai.edge.litertlm.EmbeddingEngineConfig \
              com.google.ai.edge.litertlm.EmbeddingEngine \
              com.google.ai.edge.litertlm.ActivationDataType \
              com.google.mediapipe.tasks.retrieval.universalembedder.UniversalEmbedderOptions\$Builder ; do
              echo "--- $C" >> "$OUT"
              javap -classpath "$J" "$C" 2>&1 | head -30 >> "$OUT"
            done
          done
          echo '```' >> "$OUT"

          echo "" >> "$OUT"
          echo "_Automatisch erzeugt von diag-modell.yml_" >> "$OUT"
          head -c 60000 /tmp/bericht.md > /tmp/bericht-kurz.md || true

      - name: Bericht als Commit-Kommentar ablegen
        if: always()
        shell: bash
        run: |
          test -f /tmp/bericht-kurz.md || echo "kein Bericht entstanden" > /tmp/bericht-kurz.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/bericht-kurz.md -f path= >/dev/null \
            && echo "Kommentar geschrieben" \
            || echo "::error::Kommentar konnte nicht geschrieben werden"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
