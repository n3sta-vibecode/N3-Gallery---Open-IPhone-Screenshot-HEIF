name: Modell-Umgebung messen

# Diagnose-Werkzeug: prüft, welche Klassen im ausgelieferten MediaPipe-Paket wirklich
# vorhanden sind und welche Größe die Modelldateien auf dem Server haben.
#
# Warum: Die App baut die Engine per Reflection. Wenn eine Klasse fehlt, die MediaPipe
# intern braucht (z. B. com.google.ai.edge.litertlm.ActivationDataType), scheitert der
# Start mit einer Meldung, die auf dem Gerät nur als Klassenname ankommt. Dieses Werkzeug
# schaut direkt in das AAR, das Gradle für die App auflöst – und schreibt die Fakten als
# Commit-Kommentar heraus, damit man sie ohne Runner-Logs lesen kann.

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/diag-modell.yml'

jobs:
  messen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5

      - name: Abhängigkeiten auflösen
        shell: bash
        run: |
          # Nur auflösen, nicht bauen – das AAR landet dabei im Gradle-Cache.
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon \
            > /tmp/deps.txt 2>&1 || true
          grep -iE "mediapipe|litert" /tmp/deps.txt | sort -u > /tmp/deps-mediapipe.txt || true

      - name: AARs direkt laden und untersuchen
        shell: bash
        continue-on-error: true
        run: |
          # WICHTIG: GitHub startet "bash -eo pipefail". Ohne set +e bricht der erste
          # fehlgeschlagene Befehl ab, und der Bericht entsteht nie.
          set +e +o pipefail
          OUT=/tmp/bericht.md
          {
            echo "## LiteRT-LM im Paket"
            echo ""
          } > "$OUT"

          D="https://dl.google.com/dl/android/maven2"
          rm -rf /tmp/x
          mkdir -p /tmp/x/mp /tmp/x/lm

          AAR_MP="$D/com/google/mediapipe/tasks-retrieval/1.2.3/tasks-retrieval-1.2.3.aar"
          AAR_LM="$D/com/google/ai/edge/litertlm/litertlm-android/0.17.0-alpha1/litertlm-android-0.17.0-alpha1.aar"

          {
            echo "### Download"
            curl -sSL -m 240 -o /tmp/x/mp.aar -w "tasks-retrieval: HTTP %{http_code}, %{size_download} Bytes\n" "$AAR_MP" || echo "tasks-retrieval: curl-Fehler"
            curl -sSL -m 240 -o /tmp/x/lm.aar -w "litertlm: HTTP %{http_code}, %{size_download} Bytes\n" "$AAR_LM" || echo "litertlm: curl-Fehler"
            ls -l /tmp/x
            echo ""
          } >> "$OUT" 2>&1

          ( cd /tmp/x/mp && unzip -oq ../mp.aar && echo "mp entpackt" && ls -l ) >> "$OUT" 2>&1
          ( cd /tmp/x/lm && unzip -oq ../lm.aar && echo "lm entpackt" && ls -l ) >> "$OUT" 2>&1

          {
            echo ""
            echo "### LiteRT-LM-Klassen im MediaPipe-AAR"
            echo '```'
            unzip -l /tmp/x/mp/classes.jar 2>&1 | grep -E "litertlm|UniversalEmbedder" | awk '{print $4}' | head -40
            echo '```'
            echo ""
            echo "### Klassen im LiteRT-LM-AAR"
            echo '```'
            unzip -l /tmp/x/lm/classes.jar 2>&1 | grep -E "ActivationDataType|EmbeddingEngine|Backend|EmbeddingOptions" | awk '{print $4}' | head -40
            echo '```'
            echo ""
            echo "### Signaturen (javap)"
            echo '```'
            for J in /tmp/x/lm/classes.jar /tmp/x/mp/classes.jar; do
              echo "== $J"
              for C in \
                com.google.ai.edge.litertlm.EmbeddingEngineConfig \
                com.google.ai.edge.litertlm.ActivationDataType \
                com.google.mediapipe.tasks.retrieval.universalembedder.UniversalEmbedderOptions\$Builder ; do
                echo "--- $C"
                javap -classpath "$J" "$C" 2>&1 | head -30
              done
            done
            echo '```'
            echo ""
            echo "_Automatisch erzeugt von diag-modell.yml_"
          } >> "$OUT" 2>&1

          head -c 60000 "$OUT" > /tmp/bericht-kurz.md 2>/dev/null
          ls -l /tmp/bericht-kurz.md || echo "kein Bericht" > /tmp/bericht-kurz.md

      - name: Bericht als Commit-Kommentar ablegen
        if: always()
        shell: bash
        run: |
          test -f /tmp/bericht-kurz.md || echo "kein Bericht entstanden" > /tmp/bericht-kurz.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/bericht-kurz.md -f path= >/dev/null \
            && echo "Kommentar geschrieben" \
            || echo "::error::Kommentar konnte nicht geschrieben werden"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
