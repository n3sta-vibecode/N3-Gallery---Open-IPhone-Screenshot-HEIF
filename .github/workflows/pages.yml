name: Produktseite veröffentlichen

# Veröffentlicht den Ordner docs/ als statische Seite (GitHub Pages).
#
# Einmal nötig: Repository → Settings → Pages → Source: "GitHub Actions".
# Danach läuft dieser Workflow bei jeder Änderung an der Seite automatisch
# (oder von Hand über "Run workflow").

on:
  push:
    branches:
      - 'arena/**'
      - main
      - master
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Pages vorbereiten
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Hinweis, falls Pages noch ausgeschaltet ist
        if: steps.pages.outcome != 'success'
        run: |
          {
            echo "### Produktseite noch nicht veröffentlicht"
            echo ""
            echo "GitHub Pages ist für dieses Repository noch nicht eingeschaltet."
            echo "Einmal hier umstellen, dann diesen Workflow erneut starten:"
            echo ""
            echo "1. **Settings → Pages** öffnen: https://github.com/${{ github.repository }}/settings/pages"
            echo "2. Unter **Build and deployment** als **Source** die Option **GitHub Actions** wählen."
            echo "3. **Actions → Produktseite veröffentlichen → Run workflow** (Branch \`${GITHUB_REF_NAME}\`)."
            echo ""
            echo "Danach ist die Seite unter https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ erreichbar."
            echo ""
            echo "Ohne Pages: \`docs/index.html\` herunterladen und im Browser öffnen – die Seite braucht kein Netz."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::GitHub Pages ist noch nicht eingeschaltet – siehe Schritt-Zusammenfassung."

      - name: Seite einpacken
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Veröffentlichen
        if: steps.pages.outcome == 'success'
        id: deploy
        uses: actions/deploy-pages@v4
